  en: 'Legio I Italica'
tagline:
  # DRAFT-BG: needs approval from the legion / Tourism Council – Svishtov
  bg: 'Римско историческо пресъздаване, свързано с древната крепост Нове край Свищов.'
  en: 'Roman historical reenactment linked to the ancient fortress of Novae near Svishtov.'
story:
  # DRAFT-BG: needs approval from the legion / Tourism Council – Svishtov
  bg: |
    Основан през 2005 г., **Първи Италийски легион (Legio I Italica P.F.)** е свързан с древната крепост Нове край Свищов. Участниците пресъздават римските легиони по дунавския лимес — с ръчно изработени доспехи — и представят както военни, така и цивилни персонажи.

    Групата организира фестивала **„Орел на Дунава – Легионите на Мизия“** (Eagle on the Danube – Legions of Moesia) в античния град Улпия Ескус (Гиген). Фестивалът е описван като най-стария античен фестивал в България и на Балканите. Партньори са Регионален исторически музей – Плевен и общините Плевен, Долна Митрополия и Гулянци. През 2026 г. събитието се проведе на 5–7 юни в Рибен, Плевен и Гиген.

    Групата участва и в други фестивали, например Будин (Видин, крепост „Баба Вида“, 29–30 август 2026) и Димум (Белене, септември 2026).
  en: |
    Founded in 2005, **Legio I Italica P.F.** is linked to the ancient fortress of Novae near Svishtov. Members recreate the Roman legions on the Danube limes — with handmade armour — and present both military and civilian characters.

    The group organises **Eagle on the Danube – Legions of Moesia** at the ancient city of Ulpia Oescus (Gigen). The festival is described as the oldest ancient festival in Bulgaria and the Balkans. Partners are the Regional Historical Museum – Pleven and the municipalities of Pleven, Dolna Mitropolia and Gulyantsi. In 2026 the event took place on 5–7 June in Riben, Pleven and Gigen.

    The group also takes part in other festivals, for example Budin (Vidin, Baba Vida fortress, 29–30 August 2026) and Dimum (Belene, September 2026).
